
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNAP · Control de imágenes</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:18px}
.panel{max-width:650px;margin:auto}
h1{font-size:24px}
p{color:#b9c7dc}
select,button{width:100%;padding:15px;border:0;border-radius:10px;font-size:17px;margin-top:12px}
select{background:white;color:#111}
button{font-weight:bold;background:#f4c430;color:#111}
.hide{background:#c72c35;color:white}
.preview{margin-top:18px;background:#26354a;border-radius:12px;padding:12px;text-align:center;min-height:90px}
.preview img{max-width:100%;max-height:250px;object-fit:contain}
#status{margin-top:14px;overflow-wrap:anywhere;line-height:1.5}
</style>
</head>
<body>
<div class="panel">
<h1>SNAP BROS · CONTROL DE IMÁGENES</h1>
<p>Selecciona una imagen para mostrarla en PRISM.</p>

<select id="images">
<option value="06137D7C-8C2F-4E12-9FE7-A009EB7A8062.png">4.º Cuarto</option>
</select>

<div class="preview">
<img id="preview" alt="Vista previa">
</div>

<button id="show">MOSTRAR EN PRISM</button>
<button id="hide" class="hide">OCULTAR IMAGEN</button>

<div id="status">Iniciando conexión...</div>
</div>

<script type="module">
const status=document.getElementById('status');
const images=document.getElementById('images');
const preview=document.getElementById('preview');

function message(t){
 status.textContent=t;
}

function updatePreview(){
 preview.src=new URL(
  encodeURIComponent(images.value),
  location.href
 ).href;
}

images.addEventListener('change',updatePreview);
preview.onerror=()=>message('ERROR: No se pudo cargar la imagen.');
updatePreview();

window.addEventListener('error',e=>{
 message('ERROR JavaScript: '+e.message);
});

window.addEventListener('unhandledrejection',e=>{
 message('ERROR: '+String(e.reason));
});

try{
 const [{initializeApp},{getDatabase,ref,set,onValue}]=
 await Promise.all([
  import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
  import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js')
 ]);

 message('Cargando configuración...');

 const {config}=await import('./snap-universal-data.js?v=3');

 const app=initializeApp(config);
 const db=getDatabase(app);
 const channel=ref(db,'graficos/imagen-superior');

 message('Esperando respuesta de Firebase...');

 onValue(channel,snap=>{
  const data=snap.val();
  message(data?.visible
   ?'CONECTADO · Imagen activa: '+data.file
   :'CONECTADO · Imagen oculta');
 },error=>{
  message('ERROR FIREBASE: '+error.code+' · '+error.message);
 });

 document.getElementById('show').onclick=async()=>{
  try{
   message('Enviando imagen...');
   await set(channel,{
    visible:true,
    file:images.value
   });
   message('Imagen enviada correctamente');
  }catch(e){
   message('ERROR AL MOSTRAR: '+e.code+' · '+e.message);
  }
 };

 document.getElementById('hide').onclick=async()=>{
  try{
   message('Ocultando imagen...');
   await set(channel,{
    visible:false,
    file:images.value
   });
   message('Imagen oculta correctamente');
  }catch(e){
   message('ERROR AL OCULTAR: '+e.code+' · '+e.message);
  }
 };

}catch(e){
 message('ERROR DE INICIO: '+e.message);
}
</script>
</body>
</html>
