<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNAP Universal · Control</title><style>body{font-family:Arial,sans-serif;background:#101827;color:white;margin:0;padding:18px;max-width:650px;margin:auto}h1{color:#ffd51d;font-size:24px}section{border:1px solid #526079;border-radius:12px;padding:16px;margin:12px 0}select,input,button{font-size:18px;padding:12px;border-radius:8px;box-sizing:border-box}select,input{width:100%;margin:8px 0}button{background:#f9cb24;border:0;font-weight:bold;margin:4px;min-width:70px}button.secondary{background:#d5e1f4}.score{display:flex;justify-content:space-around;font-size:46px;font-weight:bold}#clock{font-size:48px;text-align:center}small{color:#d0d8e5}#status{color:#ffdf72}#panel[hidden],#login[hidden]{display:none}img{height:75px;max-width:42%;object-fit:contain} .logos{display:flex;justify-content:space-around;align-items:center}label{display:block;margin-top:8px}</style></head><body><h1>SNAP · SCOREBOARD UNIVERSAL</h1><small>Pruebas UANL · Independiente del marcador FOD vs. FCQ</small><p id="status">Conectando…</p><section id="login"><form id="loginForm"><label>Correo de Firebase<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form></section><div id="panel" hidden><section><label>PARTIDO PROGRAMADO<select id="match"></select></label><div class="logos"><img id="logoL"><img id="logoR"></div><p id="description"></p><button id="apply">CARGAR PARTIDO Y REINICIAR</button><small>Requiere confirmación. Cambia solo la ruta partidos/universal.</small></section><section><div class="score"><span id="left">00</span><span id="right">00</span></div><div style="display:flex;justify-content:space-around"><div><button data-action="left+">+ LOCAL</button><button data-action="left-">− LOCAL</button></div><div><button data-action="right+">+ VISITA</button><button data-action="right-">− VISITA</button></div></div></section><section><div id="clock">12:00</div><center><button data-action="toggle" id="toggle">INICIAR</button><button data-action="reset" class="secondary">REINICIAR RELOJ</button></center></section><section><center><b>QTR <span id="quarter">1</span></b><br><button data-action="quarter-">−</button><button data-action="quarter+">+</button><hr><b>DOWN <span id="down">1</span></b><br><button data-action="down-">−</button><button data-action="down+">+</button></center></section><button id="logout" class="secondary">Cerrar sesión</button></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import {getDatabase,ref,onValue,set} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import {config,names,matches,initial,fmt} from './snap-universal-data.js';const app=initializeApp(config),db=getDatabase(app),auth=getAuth(app),node=ref(db,'partidos/universal'),$=id=>document.getElementById(id);let state={...initial},loaded=false,authorized=false;const remain=()=>Math.max(0,state.running?state.endAt-Date.now():state.remaining);matches.forEach((m,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${m.fecha} ${m.hora} · ${names[m.local]} vs ${names[m.visitante]}`;$('match').append(o)});
const logos = {
  prepa2: "IMG_7670.jpeg",
  eiao: "IMG_7877.png",
  prepa23: "IMG_7881.jpeg",
  cideb: "IMG_8380.png"
};

function preview() {
  let m = matches[Number($('match').value)];

  $('logoL').src = logos[m.local]
    ? `./logos/${logos[m.local]}`
    : '';

  $('logoR').src = logos[m.visitante]
    ? `./logos/${logos[m.visitante]}`
    : '';

  $('description').textContent =
    `${m.etapa} · ${names[m.local]} vs ${names[m.visitante]}`;
}
$('match').onchange=preview;preview();function render(){for(let k of ['left','right'])$(k).textContent=String(state[k]||0).padStart(2,'0');$('clock').textContent=fmt(remain());$('quarter').textContent=state.quarter||1;$('down').textContent=state.down||1;$('toggle').textContent=state.running?'PAUSAR':'INICIAR';}onValue(node,s=>{state={...initial,...(s.val()||{})};loaded=true;render();$('status').textContent=authorized?'Conectado a Firebase':'Inicia sesión';},e=>$('status').textContent='Error de lectura: '+e.message);setInterval(render,200);onAuthStateChanged(auth,u=>{authorized=!!u;$('login').hidden=authorized;$('panel').hidden=!authorized});$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(e){$('status').textContent='Error de acceso: '+e.message}};$('logout').onclick=()=>signOut(auth);async function save(n){try{await set(node,n);$('status').textContent='Guardado en Firebase'}catch(e){$('status').textContent='No se pudo guardar: '+e.message}}$('apply').onclick=()=>{if(!authorized||!loaded)return;let i=Number($('match').value),m=matches[i];if(confirm(`¿Cargar ${names[m.local]} vs ${names[m.visitante]}? Esto reiniciará marcador y reloj de la versión UNIVERSAL.`))save({...initial,match:i})};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(!authorized||!loaded)return;let n={...state},a=b.dataset.action,ms=remain();if(a==='toggle'){n.running=!state.running;n.remaining=ms;n.endAt=n.running?Date.now()+ms:0}else if(a==='reset'){if(!confirm('¿Reiniciar reloj a 12:00?'))return;n.running=false;n.remaining=720000;n.endAt=0}else if(a.startsWith('quarter'))n.quarter=Math.max(1,Math.min(4,Number(n.quarter)+(a.endsWith('+')?1:-1)));else if(a.startsWith('down'))n.down=Math.max(1,Math.min(4,Number(n.down)+(a.endsWith('+')?1:-1)));else{let k=a.startsWith('left')?'left':'right';n[k]=Math.max(0,Math.min(99,Number(n[k])+(a.endsWith('+')?1:-1)))}save(n)});
</script></body></html>
