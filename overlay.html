
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNAP Overlay PRISM</title>
<style>
html,body{
 margin:0;width:100%;height:100%;
 background:transparent!important;
 overflow:hidden;color:white;
}
.board{
 position:absolute;left:50%;top:55%;
 transform:translate(-50%,-50%);
 display:flex;align-items:center;
 gap:8px;white-space:nowrap;
 font-family:Impact,"Arial Narrow",sans-serif;
 font-weight:900;
 text-shadow:0 2px 4px black;
}
.score{font-size:9vw;min-width:1.5em;text-align:center}
.middle{text-align:center;line-height:1}
.clock{font-size:8.5vw}
.down{font-size:4vw;margin-top:5px}
</style>
</head>
<body>
<div class="board">
 <span class="score" id="left">00</span>
 <div class="middle">
  <div class="clock" id="clock">12:00</div>
  <div class="down" id="down">1ST</div>
 </div>
 <span class="score" id="right">00</span>
</div>
<script type="module">
import {initializeApp} from
'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getDatabase,ref,onValue} from
'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

const app=initializeApp({
 apiKey:"AIzaSyDhDslP2d1XUFKM9yEj0SeA-5aNJKjaUs8",
 authDomain:"snap-scoreboard.firebaseapp.com",
 databaseURL:"https://snap-scoreboard-default-rtdb.firebaseio.com",
 projectId:"snap-scoreboard",
 storageBucket:"snap-scoreboard.firebasestorage.app",
 messagingSenderId:"894028177928",
 appId:"1:894028177928:web:c5e501acc379289bb9e7bd"
});
const db=getDatabase(app);
const params=new URLSearchParams(location.search);
const path=params.get("path")||"partidos/partido1";
const $=id=>document.getElementById(id);
const pick=(s,keys,fallback)=>{
 for(const k of keys)
  if(s[k]!=null)return s[k];
 return fallback;
};
onValue(ref(db,path),snapshot=>{
 const s=snapshot.val()||{};
 const home=pick(s,["home","local","left","izq"],0);
 const away=pick(s,["away","visitante","right","der"],0);
 $("left").textContent=String(home).padStart(2,"0");
 $("right").textContent=String(away).padStart(2,"0");
 const t=pick(s,["seconds","timeLeft","tiempo"],720);
 const n=Math.max(0,Number(t)||0);
 $("clock").textContent=
 typeof t==="string"&&t.includes(":")?t:
 String(Math.floor(n/60)).padStart(2,"0")+":"+
 String(Math.floor(n%60)).padStart(2,"0");
 const d=pick(s,["down","oportunidad"],1);
 $("down").textContent=
 ["","1ST","2ND","3RD","4TH"][Number(d)]||String(d);
},console.error);
</script>
</body>
</html>
